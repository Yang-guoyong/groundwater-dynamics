project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - lectures/*.qmd
    - labs/*.qmd
    - assignments/*.qmd
  resources:
    - slides/**          # 把slides下全部pdf原样复制到_site/slides/

website:
  title: "课程主页"
  description: "讲义｜实验｜作业｜幻灯片(PDF下载)"
  sidebar:
    contents:
      - section: "讲义"
        contents: lectures/*.qmd
      - section: "实验"
        contents: labs/*.qmd
      - section: "作业"
        contents: assignments/*.qmd
      - section: "幻灯片(PDF)"
        contents:
          - text: "第01讲 幻灯片下载"
            href: "slides/slide01.pdf"
          - text: "第02讲 幻灯片下载"
            href: "slides/slide02.pdf"
  repo-url: https://github.com/你的用户名/你的仓库名
  repo-branch: main
  repo-actions: [edit]

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    highlight: github
